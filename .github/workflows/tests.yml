name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DISK_DOWNLOADER_GUI_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit, recovery, and native Windows form tests
        run: python -m unittest discover -s tests -v
      - name: Check macOS launcher and bootstrap syntax
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for script in run-gui.command run.command launch-macos.sh bootstrap-python-macos.sh; do
            /bin/zsh -n "$script"
          done
      - name: Check bootstrap syntax and isolated flow on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('bootstrap-python.ps1', 'tests/test_bootstrap_windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          & .\tests\test_bootstrap_windows.ps1
